<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>七夕乞巧 · 星河赴约</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #05050f;
    font-family: "STKaiti", "KaiTi", "楷体", "STSong", "SimSun", serif;
  }
  #app {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, #0d0a28 0%, #050510 55%, #020208 100%);
  }
  #app canvas { display: block; position: absolute; top: 0; left: 0; }

  #title-overlay {
    position: absolute;
    top: 13%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    z-index: 10;
    mix-blend-mode: screen;
  }
  .title-main {
    font-size: clamp(36px, 6vw, 84px);
    font-weight: 900;
    color: #fff0f5;
    letter-spacing: 0.15em;
    text-shadow:
      0 0 6px #ffb3d9,
      0 0 15px #ff66aa,
      0 0 30px #ff3388,
      0 0 48px #cc2266;
    opacity: 0.88;
    animation: titleGlow 4s ease-in-out infinite alternate;
  }
  .title-sub {
    margin-top: 24px;
    font-size: clamp(18px, 2.4vw, 34px);
    font-weight: 700;
    color: #ffe4ec;
    letter-spacing: 0.4em;
    text-shadow:
      0 0 5px #ffc0cb,
      0 0 12px #ff7799,
      0 0 24px #dd4477;
    opacity: 0.82;
  }
  @keyframes titleGlow {
    0%   { text-shadow: 0 0 5px #ffb3d9, 0 0 12px #ff66aa, 0 0 24px #ff3388, 0 0 36px #cc2266; }
    100% { text-shadow: 0 0 9px #ffccee, 0 0 21px #ff88bb, 0 0 36px #ff4499, 0 0 60px #dd3377; }
  }

  #hint {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 220, 230, 0.55);
    font-size: 14px;
    letter-spacing: 0.3em;
    pointer-events: none;
    z-index: 10;
  }

  #loading {
    position: absolute;
    inset: 0;
    background: #05050f;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffb3d9;
    font-size: 18px;
    letter-spacing: 0.2em;
    transition: opacity 1s ease;
    gap: 20px;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading .spinner {
    width: 40px; height: 40px;
    border: 3px solid rgba(255, 180, 210, 0.2);
    border-top-color: #ff88bb;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #fallback {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 200;
    background: rgba(5, 5, 15, 0.95);
    color: #ffc0cb;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    padding: 40px;
    text-align: center;
  }
  #fallback h2 { font-size: 24px; letter-spacing: 0.15em; }
  #fallback p { font-size: 16px; line-height: 1.8; color: #ddaabb; }
  #fallback code {
    background: rgba(255, 180, 210, 0.1);
    padding: 8px 16px;
    border-radius: 4px;
    color: #ffb3d9;
    font-family: Consolas, Monaco, monospace;
    font-size: 14px;
  }
  #fallback.show { display: flex; }
</style>
</head>
<body>
<div id="app">
  <div id="loading">
    <div class="spinner"></div>
    <div>星河初启 · 稍候...</div>
  </div>

  <div id="fallback">
    <h2>⚡ 需要本地服务器</h2>
    <p>由于浏览器安全限制，ES Module 需要通过 HTTP 服务器加载。</p>
    <p>请在当前目录下执行以下任一命令：</p>
    <code>python -m http.server 8080</code>
    <p style="margin-top:8px;">或</p>
    <code>npx serve .</code>
    <p style="margin-top:16px;">然后浏览器访问 <strong>http://localhost:8080/3D.HTML</strong></p>
  </div>

  <div id="title-overlay">
    <div class="title-main">七夕乞巧</div>
    <div class="title-sub">星河赴约</div>
  </div>
  <div id="hint">鼠标拖拽旋转 · 滚轮缩放</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
 *  七夕乞巧 · 星河赴约 —— 国风3D粒子场景
 *  单文件 · importmap + ES Module · HTTP服务器运行
 *  使用 emissive + AdditiveBlending 模拟辉光效果
 * ============================================================ */

const W = () => window.innerWidth;
const H = () => window.innerHeight;
let scene, camera, renderer, controls;
const clock = new THREE.Clock();
const container = document.getElementById('app');
const titleOverlay = document.getElementById('title-overlay');

/* ---------- Canvas程序化纹理（无外部图片） ---------- */

function createGlowTexture() {
  const size = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.2, 'rgba(255,220,240,0.85)');
  g.addColorStop(0.45,'rgba(255,150,200,0.35)');
  g.addColorStop(0.75,'rgba(200,80,160,0.08)');
  g.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function createStarTexture() {
  const size = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const cx = size/2, cy = size/2;
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, size/2);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.15,'rgba(255,240,255,0.9)');
  g.addColorStop(0.4, 'rgba(220,180,255,0.3)');
  g.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,size,size);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(255,220,240,0.6)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, cy); ctx.lineTo(size, cy);
  ctx.moveTo(cx, 0); ctx.lineTo(cx, size);
  ctx.stroke();
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function createPetalTexture() {
  const size = 128;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const cx = size/2, cy = size/2;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 55);
  ctx.bezierCurveTo(cx + 35, cy - 30, cx + 40, cy + 10, cx, cy + 55);
  ctx.bezierCurveTo(cx - 40, cy + 10, cx - 35, cy - 30, cx, cy - 55);
  ctx.closePath();
  const g = ctx.createRadialGradient(cx, cy - 10, 0, cx, cy, 60);
  g.addColorStop(0,   'rgba(255,240,248,1)');
  g.addColorStop(0.4, 'rgba(255,180,210,0.9)');
  g.addColorStop(0.8, 'rgba(230,120,170,0.5)');
  g.addColorStop(1,   'rgba(180,60,120,0.0)');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = 'rgba(220,100,150,0.4)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx, cy - 50);
  ctx.lineTo(cx, cy + 50);
  ctx.stroke();
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function createLanternTexture() {
  const size = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(size/2, size/2, 10, size/2, size/2, size/2);
  g.addColorStop(0,   'rgba(255,240,180,1)');
  g.addColorStop(0.3, 'rgba(255,140,60,1)');
  g.addColorStop(0.6, 'rgba(220,50,30,1)');
  g.addColorStop(0.85,'rgba(140,20,10,1)');
  g.addColorStop(1,   'rgba(60,10,5,1)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  ctx.globalCompositeOperation = 'overlay';
  ctx.strokeStyle = 'rgba(80,20,10,0.5)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const x = (i + 0.5) * size / 8;
    ctx.beginPath();
    ctx.moveTo(x, 10);
    ctx.lineTo(x, size - 10);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  const g2 = ctx.createRadialGradient(size/2, size*0.35, 0, size/2, size/2, size*0.3);
  g2.addColorStop(0, 'rgba(255,255,200,0.6)');
  g2.addColorStop(1, 'rgba(255,255,200,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function createSoftGlowTexture(color) {
  const size = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const ctx = cv.getContext('2d');
  const c = color || '#ff88cc';
  const g = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
  g.addColorStop(0,   hexToRgba(c, 0.9));
  g.addColorStop(0.3, hexToRgba(c, 0.5));
  g.addColorStop(0.6, hexToRgba(c, 0.15));
  g.addColorStop(1,   hexToRgba(c, 0));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.needsUpdate = true;
  return tex;
}

function hexToRgba(hex, a) {
  const h = hex.replace('#', '');
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r},${g},${b},${a})`;
}

const TEX_GLOW    = createGlowTexture();
const TEX_STAR    = createStarTexture();
const TEX_PETAL   = createPetalTexture();
const TEX_LANTERN = createLanternTexture();
const TEX_GLOW_PINK   = createSoftGlowTexture('#ff88cc');
const TEX_GLOW_GOLD   = createSoftGlowTexture('#ffcc66');
const TEX_GLOW_PURPLE = createSoftGlowTexture('#aa66ff');

/* ---------- 场景初始化 ---------- */

function initScene() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x06060f, 0.006);
  scene.background = null;

  camera = new THREE.PerspectiveCamera(55, W() / H(), 0.5, 2000);
  camera.position.set(0, 35, 110);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(W(), H());
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.domElement.style.position = 'absolute';
  renderer.domElement.style.top = '0';
  renderer.domElement.style.left = '0';
  container.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.rotateSpeed = 0.5;
  controls.zoomSpeed = 0.7;
  controls.enablePan = false;
  controls.minDistance = 25;
  controls.maxDistance = 250;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;

  const ambient = new THREE.AmbientLight(0x3a2a55, 0.7);
  scene.add(ambient);

  const heartLight = new THREE.PointLight(0xff88bb, 4.0, 130, 1.4);
  heartLight.position.set(0, 0, 0);
  scene.add(heartLight);

  const topLight = new THREE.PointLight(0xffcc66, 2.0, 160, 1.2);
  topLight.position.set(0, 80, 30);
  scene.add(topLight);

  const fillLight = new THREE.PointLight(0x8866ff, 1.2, 200, 1.0);
  fillLight.position.set(-60, 20, -40);
  scene.add(fillLight);

  const rimLight = new THREE.PointLight(0xff6699, 1.5, 180, 1.0);
  rimLight.position.set(50, -20, -50);
  scene.add(rimLight);
}

/* ---------- 1. 星空粒子 ---------- */
let starField;
function createStarField() {
  const count = 3000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    const r = 300 + Math.random() * 500;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);

    const t = Math.random();
    if (t < 0.3) { col[i*3]=1; col[i*3+1]=0.85+Math.random()*0.15; col[i*3+2]=0.9; }
    else if (t < 0.6) { col[i*3]=0.9+Math.random()*0.1; col[i*3+1]=0.7; col[i*3+2]=1; }
    else if (t < 0.85){ col[i*3]=1; col[i*3+1]=0.75; col[i*3+2]=0.85; }
    else { col[i*3]=1; col[i*3+1]=1; col[i*3+2]=1; }
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',   new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 1.2, map: TEX_STAR, vertexColors: true,
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  starField = new THREE.Points(geo, mat);
  scene.add(starField);
}

/* ---------- 2. 星系粒子 ---------- */
let galaxyParticles;
function createGalaxy() {
  const count = 4500;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);

  const armCount = 4;
  for (let i = 0; i < count; i++) {
    const arm = i % armCount;
    const radius = Math.pow(Math.random(), 0.6) * 120 + 10;
    const angle = (arm / armCount) * Math.PI * 2
                + radius * 0.04
                + (Math.random() - 0.5) * 0.6;

    const x = Math.cos(angle) * radius + (Math.random()-0.5) * 8;
    const z = Math.sin(angle) * radius + (Math.random()-0.5) * 8;
    const y = (Math.random() - 0.5) * 8 * (1 - radius / 120);

    pos[i*3]   = x; pos[i*3+1] = y; pos[i*3+2] = z;

    const ratio = 1 - radius / 130;
    col[i*3]   = 1.0;
    col[i*3+1] = 0.5 + 0.4 * ratio + Math.random() * 0.1;
    col[i*3+2] = 0.7 + 0.3 * ratio + Math.random() * 0.1;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',   new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 1.6, map: TEX_GLOW, vertexColors: true,
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  galaxyParticles = new THREE.Points(geo, mat);
  scene.add(galaxyParticles);
}

/* ---------- 3. 中央爱心花环 ---------- */
let heartGroup, heartTubeMesh;

function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return new THREE.Vector3(x * scale, y * scale, 0);
}

function createHeartGarland() {
  heartGroup = new THREE.Group();
  const scale = 0.7;
  const segments = 300;
  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = (i / segments) * Math.PI * 2;
    points.push(heartPoint(t, scale));
  }
  const heartCurve = new THREE.CatmullRomCurve3(points, true, 'catmullrom', 0.5);

  const tubeGeo = new THREE.TubeGeometry(heartCurve, 300, 0.45, 16, true);
  const tubeMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xff6600, emissiveIntensity: 1.4,
    metalness: 0.9, roughness: 0.15, transparent: true, opacity: 0.9
  });
  heartTubeMesh = new THREE.Mesh(tubeGeo, tubeMat);
  heartGroup.add(heartTubeMesh);

  const pCount = 2500;
  const pGeo = new THREE.BufferGeometry();
  const pPos = new Float32Array(pCount * 3);
  const pCol = new Float32Array(pCount * 3);

  for (let i = 0; i < pCount; i++) {
    const t = Math.random() * Math.PI * 2;
    const p = heartPoint(t, scale);
    const angle = Math.random() * Math.PI * 2;
    const radius = 0.6 + Math.random() * 2.5;
    pPos[i*3]   = p.x + Math.cos(angle) * radius;
    pPos[i*3+1] = p.y + Math.sin(angle) * radius;
    pPos[i*3+2] = (Math.random() - 0.5) * 2.5;

    const c = Math.random();
    if (c < 0.5)      { pCol[i*3]=1; pCol[i*3+1]=0.85; pCol[i*3+2]=0.35; }
    else if (c < 0.8) { pCol[i*3]=1; pCol[i*3+1]=0.55; pCol[i*3+2]=0.8; }
    else              { pCol[i*3]=1; pCol[i*3+1]=1; pCol[i*3+2]=1; }
  }

  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute('color',   new THREE.BufferAttribute(pCol, 3));

  const pMat = new THREE.PointsMaterial({
    size: 1.8, map: TEX_GLOW, vertexColors: true,
    transparent: true, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  heartGroup.add(new THREE.Points(pGeo, pMat));

  const fillCount = 1500;
  const fGeo = new THREE.BufferGeometry();
  const fPos = new Float32Array(fillCount * 3);
  const fCol = new Float32Array(fillCount * 3);
  for (let i = 0; i < fillCount; i++) {
    let x, y, inside = false;
    for (let attempt = 0; attempt < 20 && !inside; attempt++) {
      x = (Math.random() - 0.5) * 24 * scale;
      y = (Math.random() - 0.5) * 24 * scale;
      const X = x / (8 * scale);
      const Y = y / (8 * scale);
      const v = Math.pow(X*X + Y*Y - 1, 3) - X*X * Y*Y*Y;
      if (v < 0) inside = true;
    }
    fPos[i*3]   = x + (Math.random()-0.5)*0.5;
    fPos[i*3+1] = y + (Math.random()-0.5)*0.5;
    fPos[i*3+2] = (Math.random()-0.5)*2;
    fCol[i*3]   = 1;
    fCol[i*3+1] = 0.7 + Math.random()*0.3;
    fCol[i*3+2] = 0.5 + Math.random()*0.4;
  }
  fGeo.setAttribute('position', new THREE.BufferAttribute(fPos, 3));
  fGeo.setAttribute('color',   new THREE.BufferAttribute(fCol, 3));
  const fMat = new THREE.PointsMaterial({
    size: 0.9, map: TEX_GLOW, vertexColors: true,
    transparent: true, opacity: 0.6,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  heartGroup.add(new THREE.Points(fGeo, fMat));

  const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW_PINK, color: 0xff99cc,
    transparent: true, opacity: 0.6,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  glowSprite.scale.set(45, 45, 1);
  heartGroup.add(glowSprite);

  scene.add(heartGroup);
}

/* ---------- 4. 古风灯笼 ---------- */
const lanterns = [];
function createLantern(x, y, z, scale) {
  scale = scale || 1;
  const group = new THREE.Group();

  const bodyGeo = new THREE.SphereGeometry(1.2 * scale, 24, 20);
  bodyGeo.scale(1, 0.75, 1);
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0xcc2222, emissive: 0xff3311, emissiveIntensity: 1.4,
    metalness: 0.3, roughness: 0.5, map: TEX_LANTERN
  });
  group.add(new THREE.Mesh(bodyGeo, bodyMat));

  const capGeo = new THREE.CylinderGeometry(0.9 * scale, 1.0 * scale, 0.25 * scale, 16);
  const capMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, metalness: 0.6, roughness: 0.4 });
  const cap1 = new THREE.Mesh(capGeo, capMat);
  cap1.position.y = 0.95 * scale;
  group.add(cap1);
  const cap2 = new THREE.Mesh(capGeo, capMat);
  cap2.position.y = -0.95 * scale;
  group.add(cap2);

  const tasselGeo = new THREE.ConeGeometry(0.15 * scale, 0.7 * scale, 8);
  const tasselMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, emissive: 0xffaa00, emissiveIntensity: 0.5
  });
  const tassel = new THREE.Mesh(tasselGeo, tasselMat);
  tassel.position.y = -1.5 * scale;
  tassel.rotation.x = Math.PI;
  group.add(tassel);

  const beadGeo = new THREE.SphereGeometry(0.12 * scale, 12, 12);
  const beadMat = new THREE.MeshStandardMaterial({
    color: 0xffd700, metalness: 0.8, roughness: 0.2,
    emissive: 0xffaa00, emissiveIntensity: 0.5
  });
  const bead = new THREE.Mesh(beadGeo, beadMat);
  bead.position.y = 1.15 * scale;
  group.add(bead);

  group.add(new THREE.PointLight(0xff6633, 1.5, 25, 2.0));

  const glowMat = new THREE.SpriteMaterial({
    map: TEX_GLOW_PINK, color: 0xff6644,
    transparent: true, opacity: 0.45,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const glowSprite = new THREE.Sprite(glowMat);
  glowSprite.scale.set(6 * scale, 6 * scale, 1);
  group.add(glowSprite);

  group.position.set(x, y, z);
  group.userData = { baseY: y, phase: Math.random() * Math.PI * 2, speed: 0.3 + Math.random() * 0.4 };
  scene.add(group);
  lanterns.push(group);
}

function createAllLanterns() {
  [
    [-35, 30,  -20, 1.0], [ 38, 25,  -25, 1.1],
    [-28, 50,   15, 0.9], [ 30, 55,   10, 1.0],
    [-45, 15,   25, 0.85],[ 48, 18,   30, 0.95],
    [  0, 60,  -35, 1.2], [  0, 65,   40, 0.8]
  ].forEach(p => createLantern(p[0], p[1], p[2], p[3]));
}

/* ---------- 5. 喜鹊 ---------- */
const magpies = [];
function createMagpie() {
  const group = new THREE.Group();

  const bodyGeo = new THREE.SphereGeometry(1, 16, 12);
  bodyGeo.scale(2.2, 0.8, 1);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.2, roughness: 0.6 });
  group.add(new THREE.Mesh(bodyGeo, bodyMat));

  const bellyGeo = new THREE.SphereGeometry(0.6, 12, 10);
  bellyGeo.scale(2, 0.8, 0.8);
  const belly = new THREE.Mesh(bellyGeo, new THREE.MeshStandardMaterial({ color: 0xf5f5f5, metalness: 0.1, roughness: 0.5 }));
  belly.position.set(0.2, -0.3, 0.3);
  group.add(belly);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.65, 14, 12), bodyMat);
  head.position.set(1.8, 0.5, 0);
  group.add(head);

  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.1, 8, 8), eyeMat);
  eye1.position.set(2.1, 0.65, 0.35);
  group.add(eye1);
  const eye2 = eye1.clone(); eye2.position.z = -0.35; group.add(eye2);

  const beak = new THREE.Mesh(
    new THREE.ConeGeometry(0.12, 0.35, 6),
    new THREE.MeshStandardMaterial({ color: 0xd4a017 })
  );
  beak.rotation.z = -Math.PI / 2;
  beak.position.set(2.45, 0.5, 0);
  group.add(beak);

  const wingGeo = new THREE.BoxGeometry(0.5, 1.2, 2.2);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, side: THREE.DoubleSide, metalness: 0.3, roughness: 0.5 });
  const wingL = new THREE.Mesh(wingGeo, wingMat);
  wingL.position.set(0, 0.4, 1.0); wingL.rotation.x = 0.3;
  group.add(wingL);
  const wingR = new THREE.Mesh(wingGeo, wingMat);
  wingR.position.set(0, 0.4, -1.0); wingR.rotation.x = -0.3;
  group.add(wingR);

  const tail = new THREE.Mesh(
    new THREE.ConeGeometry(0.4, 2, 6), bodyMat
  );
  tail.rotation.z = Math.PI / 2;
  tail.position.set(-2, 0.2, 0);
  group.add(tail);

  group.userData = {
    wingL, wingR,
    orbitCenter: new THREE.Vector3(),
    orbitRadius: 30 + Math.random() * 20,
    orbitHeight: 10 + Math.random() * 30,
    orbitPhase: Math.random() * Math.PI * 2,
    orbitSpeed: 0.15 + Math.random() * 0.15,
    flapSpeed: 8 + Math.random() * 4
  };
  return group;
}

function createAllMagpies() {
  for (let i = 0; i < 6; i++) {
    const m = createMagpie();
    m.userData.orbitCenter.set(
      (Math.random() - 0.5) * 40,
      m.userData.orbitHeight,
      (Math.random() - 0.5) * 40
    );
    scene.add(m);
    magpies.push(m);
  }
}

/* ---------- 6. 古风丝带 ---------- */
const ribbons = [];
function createRibbon(startPos, color) {
  const points = [];
  for (let i = 0; i < 12; i++) {
    points.push(new THREE.Vector3(
      startPos.x + i * 5 - 30,
      startPos.y + Math.sin(i * 0.6) * 8,
      startPos.z + Math.cos(i * 0.4) * 6
    ));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, 200, 0.35, 12, false);
  const mat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.5,
    transparent: true, opacity: 0.55, side: THREE.DoubleSide,
    metalness: 0.1, roughness: 0.8
  });
  const ribbon = new THREE.Mesh(geo, mat);
  const origPositions = new Float32Array(geo.attributes.position.array);
  ribbon.userData = {
    origPositions, baseY: startPos.y,
    phase: Math.random() * Math.PI * 2,
    speed: 0.4 + Math.random() * 0.3,
    segCount: 200, radialSeg: 12
  };
  scene.add(ribbon);
  ribbons.push(ribbon);
}

function createAllRibbons() {
  createRibbon(new THREE.Vector3(-50, 0, -30), 0xff88cc);
  createRibbon(new THREE.Vector3(-40, 15, 20), 0xcc88ff);
  createRibbon(new THREE.Vector3(30, 5, -20), 0xffaa88);
  createRibbon(new THREE.Vector3(40, -5, 30), 0xff7799);
  createRibbon(new THREE.Vector3(-20, 30, 0), 0xffccdd);
}

/* ---------- 7. 荷花 ---------- */
const lotusFlowers = [];
function createLotusFlower(x, y, z, scale) {
  scale = scale || 1;
  const group = new THREE.Group();

  const centerGeo = new THREE.SphereGeometry(0.5 * scale, 16, 12);
  const centerMat = new THREE.MeshStandardMaterial({
    color: 0xffdd44, emissive: 0xffaa22, emissiveIntensity: 0.8,
    metalness: 0.4, roughness: 0.3
  });
  const center = new THREE.Mesh(centerGeo, centerMat);
  center.scale.y = 0.7;
  group.add(center);

  const petalColors = [0xff99cc, 0xffbbdd, 0xffccee];
  const layers = [
    { count: 6, radius: 0.8, rot: 0,    size: 1.2 },
    { count: 6, radius: 0.8, rot: 0.52, size: 1.0 },
    { count: 5, radius: 0.7, rot: 0.26, size: 0.8 },
  ];

  layers.forEach((layer, li) => {
    const color = petalColors[li] || 0xffaacc;
    for (let i = 0; i < layer.count; i++) {
      const angle = (i / layer.count) * Math.PI * 2 + layer.rot;
      const petalGeo = new THREE.SphereGeometry(1 * scale * layer.size, 12, 8);
      petalGeo.scale(0.35, 0.12, 1);
      const petalMat = new THREE.MeshStandardMaterial({
        color, emissive: color, emissiveIntensity: 0.35,
        transparent: true, opacity: 0.85, side: THREE.DoubleSide,
        metalness: 0.05, roughness: 0.6
      });
      const petal = new THREE.Mesh(petalGeo, petalMat);
      const r = layer.radius * scale * 1.1;
      petal.position.set(Math.cos(angle) * r, 0.15 * scale - li * 0.05, Math.sin(angle) * r);
      petal.rotation.z = Math.cos(angle) * 0.5;
      petal.rotation.x = Math.sin(angle) * 0.5;
      petal.rotation.y = angle;
      group.add(petal);
    }
  });

  group.position.set(x, y, z);
  group.userData = {
    baseY: y, phase: Math.random() * Math.PI * 2,
    speed: 0.25 + Math.random() * 0.2,
    rotSpeed: (Math.random() - 0.5) * 0.3
  };
  scene.add(group);
  lotusFlowers.push(group);
}

/* ---------- 8. 飘落桃花瓣 ---------- */
const PETAL_COUNT = 350;
let petalSystem;

function createFallingPetals() {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(PETAL_COUNT * 3);
  const vel = new Float32Array(PETAL_COUNT * 3);
  const col = new Float32Array(PETAL_COUNT * 3);

  for (let i = 0; i < PETAL_COUNT; i++) {
    pos[i*3]   = (Math.random() - 0.5) * 250;
    pos[i*3+1] = Math.random() * 160 - 10;
    pos[i*3+2] = (Math.random() - 0.5) * 250;

    vel[i*3]   = (Math.random() - 0.5) * 0.04;
    vel[i*3+1] = -(0.08 + Math.random() * 0.15);
    vel[i*3+2] = (Math.random() - 0.5) * 0.04;

    const shade = Math.random();
    col[i*3]   = 1.0;
    col[i*3+1] = 0.55 + shade * 0.3;
    col[i*3+2] = 0.7 + shade * 0.2;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',   new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 2.2, map: TEX_PETAL, vertexColors: true,
    transparent: true, opacity: 0.9,
    depthWrite: false, blending: THREE.NormalBlending, sizeAttenuation: true
  });
  petalSystem = new THREE.Points(geo, mat);
  scene.add(petalSystem);
  petalSystem.userData = { velocities: vel };
}

/* ---------- 9. Sprite花瓣 ---------- */
const petalSprites = [];
function createPetalSprites() {
  for (let i = 0; i < 80; i++) {
    const mat = new THREE.SpriteMaterial({
      map: TEX_PETAL, color: 0xffccee,
      transparent: true, opacity: 0.85,
      blending: THREE.NormalBlending, depthWrite: false
    });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(3, 3, 1);
    sprite.position.set(
      (Math.random() - 0.5) * 250,
      Math.random() * 160 - 10,
      (Math.random() - 0.5) * 250
    );
    sprite.userData = {
      vel: new THREE.Vector3(
        (Math.random() - 0.5) * 0.03,
        -(0.05 + Math.random() * 0.12),
        (Math.random() - 0.5) * 0.03
      ),
      spin: new THREE.Vector3(
        (Math.random() - 0.5) * 0.04,
        (Math.random() - 0.5) * 0.04,
        (Math.random() - 0.5) * 0.04
      )
    };
    scene.add(sprite);
    petalSprites.push(sprite);
  }
}

/* ---------- 10. 闪烁光点 ---------- */
let sparkles;
function createSparkles() {
  const count = 600;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const phase = new Float32Array(count);

  for (let i = 0; i < count; i++) {
    pos[i*3]   = (Math.random() - 0.5) * 60;
    pos[i*3+1] = (Math.random() - 0.5) * 50;
    pos[i*3+2] = (Math.random() - 0.5) * 40;

    const c = Math.random();
    if (c < 0.4)      { col[i*3]=1; col[i*3+1]=0.9; col[i*3+2]=0.5; }
    else if (c < 0.7) { col[i*3]=1; col[i*3+1]=0.7; col[i*3+2]=0.9; }
    else              { col[i*3]=1; col[i*3+1]=1; col[i*3+2]=1; }
    phase[i] = Math.random() * Math.PI * 2;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',   new THREE.BufferAttribute(col, 3));

  const mat = new THREE.PointsMaterial({
    size: 2.5, map: TEX_GLOW, vertexColors: true,
    transparent: true, opacity: 0.85,
    depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  sparkles = new THREE.Points(geo, mat);
  scene.add(sparkles);
  sparkles.userData = { phases: phase, origPositions: new Float32Array(pos) };
}

/* ---------- 11. 爱心光环 ---------- */
let haloRing, haloOuter, haloGlow;
function createHeartHalo() {
  const innerGeo = new THREE.TorusGeometry(18, 0.15, 16, 200);
  const innerMat = new THREE.MeshStandardMaterial({
    color: 0xffaacc, emissive: 0xff6699, emissiveIntensity: 1.5,
    metalness: 0.6, roughness: 0.3, transparent: true, opacity: 0.7
  });
  haloRing = new THREE.Mesh(innerGeo, innerMat);
  haloRing.rotation.x = Math.PI / 2;
  scene.add(haloRing);

  haloOuter = new THREE.Mesh(
    new THREE.TorusGeometry(22, 0.08, 12, 200),
    new THREE.MeshStandardMaterial({
      color: 0xffccdd, emissive: 0xff88bb, emissiveIntensity: 1.0,
      transparent: true, opacity: 0.4, side: THREE.DoubleSide, depthWrite: false
    })
  );
  haloOuter.rotation.x = Math.PI / 2;
  scene.add(haloOuter);

  haloGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: TEX_GLOW_PINK, color: 0xff99cc,
    transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false
  }));
  haloGlow.scale.set(55, 55, 1);
  scene.add(haloGlow);
}

/* ---------- 初始化 ---------- */
function initAll() {
  initScene();
  createStarField();
  createGalaxy();
  createHeartGarland();
  createAllLanterns();
  createAllMagpies();
  createAllRibbons();

  [
    [-14, -8, 2, 0.5], [14, -8, 2, 0.5],
    [-8, -4, -4, 0.45], [8, -4, -4, 0.45],
    [0, -10, 0, 0.55]
  ].forEach(p => createLotusFlower(p[0], p[1], p[2], p[3]));

  createFallingPetals();
  createPetalSprites();
  createSparkles();
  createHeartHalo();
}

/* ---------- 动画循环 ---------- */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if (starField) {
    starField.rotation.y = t * 0.01;
    starField.rotation.x = t * 0.005;
  }

  if (galaxyParticles) galaxyParticles.rotation.y = t * 0.05;

  if (heartGroup) {
    heartGroup.rotation.y = Math.sin(t * 0.2) * 0.15;
    heartGroup.rotation.z = Math.sin(t * 0.3) * 0.05;
  }

  if (heartTubeMesh) {
    const s = 1 + Math.sin(t * 1.5) * 0.03;
    heartTubeMesh.scale.set(s, s, s);
  }

  lanterns.forEach(l => {
    const d = l.userData;
    l.position.y = d.baseY + Math.sin(t * d.speed + d.phase) * 1.2;
    l.rotation.y = Math.sin(t * 0.5 + d.phase) * 0.2;
  });

  magpies.forEach(m => {
    const d = m.userData;
    const angle = t * d.orbitSpeed + d.orbitPhase;
    m.position.x = d.orbitCenter.x + Math.cos(angle) * d.orbitRadius;
    m.position.z = d.orbitCenter.z + Math.sin(angle) * d.orbitRadius;
    m.position.y = d.orbitCenter.y + Math.sin(t * 2 + d.orbitPhase) * 3;
    m.rotation.y = angle + Math.PI / 2;
    const flap = Math.sin(t * d.flapSpeed + d.orbitPhase) * 0.8;
    d.wingL.rotation.x = 0.3 + flap;
    d.wingR.rotation.x = -0.3 - flap;
    m.rotation.z = Math.sin(t * 3 + d.orbitPhase) * 0.1;
  });

  ribbons.forEach(r => {
    const d = r.userData;
    const pos = r.geometry.attributes.position.array;
    const orig = d.origPositions;
    const rs = d.radialSeg;
    for (let i = 0; i < pos.length; i += 3) {
      const vertexIdx = i / 3;
      const tubularSeg = Math.floor(vertexIdx / rs);
      const baseT = tubularSeg / d.segCount;
      const wave1 = Math.sin(t * d.speed + baseT * Math.PI * 4 + d.phase) * 1.5;
      const wave2 = Math.cos(t * d.speed * 1.3 + baseT * Math.PI * 6 + d.phase) * 1.0;
      pos[i + 1] = orig[i + 1] + wave1 + wave2;
    }
    r.geometry.attributes.position.needsUpdate = true;
    r.position.y = Math.sin(t * d.speed + d.phase) * 0.8;
  });

  lotusFlowers.forEach(obj => {
    obj.position.y = obj.userData.baseY + Math.sin(t * obj.userData.speed + obj.userData.phase) * 1.5;
    obj.rotation.y += obj.userData.rotSpeed * 0.016;
  });

  if (petalSystem) {
    const pos = petalSystem.geometry.attributes.position.array;
    const vel = petalSystem.userData.velocities;
    for (let i = 0; i < PETAL_COUNT; i++) {
      pos[i*3]   += vel[i*3] + Math.sin(t + i) * 0.005;
      pos[i*3+1] += vel[i*3+1];
      pos[i*3+2] += vel[i*3+2] + Math.cos(t + i) * 0.005;
      if (pos[i*3+1] < -20) {
        pos[i*3]   = (Math.random() - 0.5) * 250;
        pos[i*3+1] = 140 + Math.random() * 30;
        pos[i*3+2] = (Math.random() - 0.5) * 250;
      }
      if (pos[i*3] > 130)  pos[i*3] = -130;
      if (pos[i*3] < -130) pos[i*3] = 130;
      if (pos[i*3+2] > 130)  pos[i*3+2] = -130;
      if (pos[i*3+2] < -130) pos[i*3+2] = 130;
    }
    petalSystem.geometry.attributes.position.needsUpdate = true;
  }

  petalSprites.forEach(s => {
    s.position.add(s.userData.vel);
    s.rotation.x += s.userData.spin.x;
    s.rotation.y += s.userData.spin.y;
    s.rotation.z += s.userData.spin.z;
    if (s.position.y < -20) {
      s.position.set((Math.random()-0.5)*250, 140+Math.random()*30, (Math.random()-0.5)*250);
    }
    if (s.position.x > 130)  s.position.x = -130;
    if (s.position.x < -130) s.position.x = 130;
    if (s.position.z > 130)  s.position.z = -130;
    if (s.position.z < -130) s.position.z = 130;
  });

  if (sparkles) {
    const pos = sparkles.geometry.attributes.position.array;
    const phases = sparkles.userData.phases;
    const orig = sparkles.userData.origPositions;
    for (let i = 0; i < phases.length; i++) {
      const phase = phases[i] + t;
      pos[i*3]   = orig[i*3]   + Math.sin(phase * 1.3) * 0.8;
      pos[i*3+1] = orig[i*3+1] + Math.cos(phase * 1.1) * 0.8;
      pos[i*3+2] = orig[i*3+2] + Math.sin(phase * 0.9) * 0.8;
    }
    sparkles.geometry.attributes.position.needsUpdate = true;
    sparkles.material.size = 2 + Math.sin(t * 2) * 0.5;
  }

  if (haloRing) {
    haloRing.rotation.z = t * 0.15;
    const sc = 1 + Math.sin(t * 0.8) * 0.05;
    haloRing.scale.set(sc, sc, 1);
  }
  if (haloOuter) {
    haloOuter.rotation.z = -t * 0.1;
  }
  if (haloGlow) {
    const sc = 1 + Math.sin(t * 0.6) * 0.08;
    haloGlow.scale.set(55 * sc, 55 * sc, 1);
    haloGlow.material.opacity = 0.4 + Math.sin(t * 1.2) * 0.15;
  }

  renderer.toneMappingExposure = 1.15 + Math.sin(t * 0.5) * 0.1;

  // 根据相机距离动态缩放标题文字
  if (titleOverlay && camera && controls) {
    const dist = camera.position.distanceTo(controls.target);
    const BASE_DIST = 115;
    let s = BASE_DIST / dist;
    s = Math.max(0.45, Math.min(2.8, s));
    titleOverlay.style.transform = `translate(-50%, -50%) scale(${s})`;
    // 放大（近距）时文字逐渐淡出退出屏幕
    const fadeStart = 80;
    const fadeEnd = 35;
    let opacity = 1;
    if (dist < fadeStart) {
      opacity = Math.max(0, (dist - fadeEnd) / (fadeStart - fadeEnd));
    }
    titleOverlay.style.opacity = opacity;
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ---------- 窗口自适应 ---------- */
function onResize() {
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
}
window.addEventListener('resize', onResize);

/* ---------- 启动 ---------- */
try {
  initAll();
  const loadingEl = document.getElementById('loading');
  setTimeout(() => {
    loadingEl.classList.add('hidden');
    setTimeout(() => loadingEl.style.display = 'none', 1000);
  }, 300);
  animate();
} catch (err) {
  console.error('初始化失败:', err);
  document.getElementById('loading').style.display = 'none';
  document.getElementById('fallback').classList.add('show');
}
